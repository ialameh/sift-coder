name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx --no-install tsc

      - name: Tests + coverage gate
        run: npx --no-install vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node${{ matrix.node }}
          path: coverage/
          retention-days: 7

  package-smoke:
    name: package install smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Fresh install (postinstall must succeed)
        run: |
          rm -rf node_modules
          npm ci

      - name: Verify dist artifacts present
        run: |
          test -f dist/memory/cli.js
          test -f dist/memory/daemon/index.js
          test -f dist/memory/mcp/server.js
          test -f dist/memory/web/static/index.html
          test -f dist/memory/web/static/app.js
          test -f dist/memory/web/static/style.css

      - name: Verify dist syntax
        run: |
          node --check dist/memory/cli.js
          node --check dist/memory/daemon/index.js
          node --check dist/memory/mcp/server.js
